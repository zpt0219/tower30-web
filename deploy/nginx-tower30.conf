    # Tower30 static web app: managed by tower30-web
    location = /tower30 { return 301 /tower30/; }
    location /tower30/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location = /api/check/tower30 {
        alias /var/www/portal/tower30/release.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    # End Tower30 static web app
